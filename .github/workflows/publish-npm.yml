name: Publish Theme to NPM
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://npm.cnb.cool/hcf-ai/npm/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme packages
        run: pnpm build

      - name: Publish to npm
        run: pnpm -r run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
